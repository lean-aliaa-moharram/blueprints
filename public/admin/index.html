<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lean blueprints</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --forest:#1c2024; --bright:#3dd68c; --bright-ink:#0f2a1e; --mint:#e3f8ee;
  --paper:#f6f7f6; --card:#ffffff; --ink:#1c2024; --muted:#646b75; --line:#e3e6e9; --warn:#b4232c;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--paper:#121518;--card:#1a1e22;--ink:#e8eaed;--muted:#9aa2ad;--line:#2c3238;--mint:#16382a;--warn:#ff7b84}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.bar{background:var(--forest);color:#fff;display:flex;align-items:center;gap:14px;padding:14px 28px}
.bar .mark{width:26px;height:26px;border-radius:7px;background:var(--bright);display:grid;place-items:center;color:var(--bright-ink);font-weight:800;font-size:14px}
.bar h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.01em}
.bar .spacer{flex:1}
.bar button{background:transparent;border:1px solid #3a4148;color:#d6dade;border-radius:8px;padding:6px 12px;cursor:pointer}
.bar button:hover{border-color:var(--bright);color:#fff}
.signin{max-width:380px;margin:12vh auto;padding:0 20px}
.signin h2{font-size:26px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
.signin p{color:var(--muted);margin:0 0 22px}
label{display:block;font-weight:600;font-size:13px;margin:0 0 6px}
input[type=text],input[type=password],input[type=url],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px}
input[type=text],input[type=password],input[type=url],select{height:44px}
textarea{padding:10px 12px;min-height:76px;resize:vertical;line-height:1.5}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--bright);outline-offset:2px}
.primary{background:var(--bright);color:var(--bright-ink);border:0;border-radius:10px;height:44px;padding:0 16px;font-weight:700;cursor:pointer;white-space:nowrap}
.primary:hover{filter:brightness(.95)}
.primary[disabled],.ghost[disabled]{opacity:.55;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.ghost:hover{border-color:var(--bright)}
.ghost.danger:hover{border-color:var(--warn);color:var(--warn)}
.err{color:var(--warn);font-size:13.5px;margin-top:10px;min-height:1.4em}
.err:empty{min-height:0;margin:0}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 54px)}
.side{border-right:1px solid var(--line);padding:22px 16px;background:var(--card)}
.side h2{font-size:13px;font-weight:700;color:var(--muted);margin:0 8px 10px}
.grouph{font-size:12.5px;font-weight:700;color:var(--muted);margin:18px 12px 6px;display:flex;gap:6px;align-items:center}
.grouph span{font-weight:600;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:11.5px}
.addbp{width:100%;margin:0 0 8px;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px}
.bp{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:11px 12px;cursor:pointer;margin-bottom:2px}
.bp:hover{background:var(--paper)}
.bp[aria-current="true"]{background:var(--mint)}
.bp .t{font-weight:700;font-size:14px;line-height:1.35;display:block}
.bp .s{font-size:12.5px;color:var(--muted)}
.meter{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--bright)}
.main{padding:28px 36px 80px;max-width:1100px;min-width:0}
.main h2{overflow-wrap:anywhere;font-size:28px;font-weight:800;margin:0 0 4px;letter-spacing:-.015em;line-height:1.2}
.main .sub{color:var(--muted);margin:0 0 26px}
section.blk{margin-bottom:34px}
section.blk h3{font-size:16px;font-weight:700;margin:0 0 12px}
.share{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:2fr 1fr 1.3fr auto;gap:12px;align-items:end}
.created{margin-top:12px;background:var(--mint);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.created code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;flex:1;min-width:200px}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .who{font-weight:700}
.tablewrap td:first-child{min-width:150px}
.tablewrap td:last-child{width:1%;min-width:230px}
.tablewrap .actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tablewrap .actions .ghost{text-align:center}
.tablewrap td .by{white-space:nowrap}
.envsel{display:flex;align-items:center;gap:6px;margin:8px 0 0;font-size:12.5px;font-weight:600;color:var(--muted)}
.prodreq{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:#fff8e6;border:1px solid #f3d27a;font-size:12.5px;color:#5c4100;max-width:340px}
.prodnote{margin-top:4px;font-style:italic;color:#6b5200;white-space:pre-wrap}
.domsel{margin:8px 0 0;font-size:12.5px;font-weight:600;color:var(--muted);max-width:340px}
.domsel label{display:block;margin-bottom:4px}
.domrow{display:flex;gap:6px}
.domrow input{flex:1;min-width:0;font:inherit;font-weight:500;color:var(--ink);padding:5px 8px;border:1px solid var(--line);border-radius:7px}
.cmtbadge{display:inline-block;margin-top:5px;margin-left:4px;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:#fff8e6;border:1px solid #e0a400;color:#8a5a00}
.clist{list-style:none;margin:6px 0 0;padding:0}
.clist>li{border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:0 0 8px;background:#fff}
.clist>li.resolved{opacity:.65}
.clist .cq{background:#fff8e6;border-left:3px solid #e0a400;padding:5px 8px;border-radius:5px;margin-bottom:6px;font-size:12.5px}
.clist .cc{margin:0 0 6px;white-space:pre-wrap}
.menote{font-size:13px;color:#b8c0c9;margin-right:12px}
.menote b{color:#fff}
.menote .linkish{color:#fff;border:0;background:none;padding:0;height:auto}
.linkish{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--ink);text-decoration:underline;cursor:pointer}
.ownerline{font-size:13px;color:var(--muted);margin:12px 0 0}
.ownerline b{color:var(--ink)}
.meform label{display:block;font-weight:600;font-size:13px;margin:10px 0 0}
.meform input{display:block;width:100%;box-sizing:border-box;margin-top:4px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.meform .err{color:#b3261e;font-size:13px;margin:6px 0 0}
.unread{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--bright,#3dd68c);color:#0f2a1e;font-size:11.5px;font-weight:800;line-height:18px;text-align:center}
.wn{list-style:none;margin:0 0 14px;padding:0}
.wn>li{margin:0 0 8px}
.wn-item{display:block;width:100%;text-align:left;background:var(--card,#fff);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;color:var(--ink);cursor:pointer}
.wn>li.new .wn-item{border-color:var(--bright,#3dd68c);box-shadow:0 0 0 1px var(--bright,#3dd68c)}
.wn-item:focus-visible{outline:2px solid var(--bright,#3dd68c);outline-offset:2px}
.wn-top{font-size:14px}
.wn-bp{color:var(--muted)}
.wn-at{float:right;color:var(--muted);font-size:12.5px}
.wn-new{display:inline-block;font-size:11px;font-weight:800;padding:0 7px;border-radius:999px;background:var(--bright,#3dd68c);color:#0f2a1e;margin-left:4px}
.wn-body{margin-top:4px;font-size:13px;color:var(--muted);white-space:pre-wrap}
.wn-q{font-style:italic}
.wn-all{display:flex;gap:8px;align-items:center;font-size:13px;margin:8px 0 14px}
.versions{margin:10px 0 4px;font-size:13px;max-width:720px}
.versions>summary{cursor:pointer;font-weight:700;color:var(--ink)}
.vlist{list-style:none;margin:6px 0 0;padding:0}
.vlist li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.vlist .va{display:flex;gap:6px;flex-shrink:0}
.importdlg{max-width:620px;width:calc(100vw - 40px);border:0;border-radius:14px;padding:22px 24px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.importdlg::backdrop{background:rgba(15,18,22,.5)}
.importdlg h3{margin:0 0 6px;font-size:19px}
.importdlg .ichecks{list-style:none;padding:0;margin:12px 0}
.importdlg .ichecks>li{padding:8px 10px;border-radius:9px;margin:0 0 6px;font-size:13.5px}
.importdlg .ichecks>li.ok{background:#effaf4}
.importdlg .ichecks>li.bad{background:#fff4f2}
.importdlg .ichecks ul{margin:6px 0 0;padding-left:18px;color:#5c2a24}
.importdlg .inotes{background:#fff8e6;border:1px solid #f3d27a;border-radius:9px;padding:9px 12px;font-size:13px;margin:0 0 10px}
.importdlg .inotes ul{margin:4px 0 0;padding-left:18px}
.importdlg .iact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.notifyform{margin:14px 0 4px;font-size:12.5px;font-weight:600;color:var(--muted);max-width:520px}
.notifyform label{display:block;margin-bottom:4px}
.notifyform .by{margin:4px 0 0;font-weight:500}
.by.storage{font-size:12.5px;margin:2px 0 8px}
/* blueprint page: header, tabs, cards */
.bphead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:0 0 14px}
.bphead h2{margin:0 0 4px}
.bphead .sub{margin:0;color:var(--muted);font-size:14px}
.bphead-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bphead-r .primary,.bphead-r .ghost{height:36px}
details.menuwrap{position:relative}
details.menuwrap>summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-weight:700;font-size:13.5px;background:var(--card,#fff);color:var(--ink);user-select:none}
details.menuwrap>summary::-webkit-details-marker{display:none}
details.menuwrap .menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:170px;background:var(--card,#fff);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column}
details.menuwrap .menu button,details.menuwrap .menu label{all:unset;cursor:pointer;padding:8px 10px;border-radius:7px;font-size:13.5px;color:var(--ink)}
details.menuwrap .menu button:hover,details.menuwrap .menu label:hover{background:var(--line)}
details.menuwrap .menu .danger{color:#b3261e}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.tabs .tab{all:unset;cursor:pointer;padding:9px 12px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--bright,#3dd68c)}
.tabs .tab:focus-visible{outline:2px solid var(--bright,#3dd68c);outline-offset:2px;border-radius:6px}
.tabn{display:inline-block;min-width:16px;padding:0 5px;margin-left:3px;border-radius:999px;background:var(--line);color:var(--ink);font-size:11px;line-height:16px;text-align:center}
.tabpanel{max-width:980px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--card,#fff);padding:16px 18px;margin:0 0 22px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:17px}
.card .envsel{margin:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 10px}
.stats>div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stats b{display:block;font-size:16px;color:var(--ink)}
.stats span{font-size:12px;color:var(--muted)}
.card .people{margin:6px 0 10px;max-width:none;font-size:13px}
.card .people .pl{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.card .people .pk{font-weight:700;color:var(--muted);margin-right:4px}
.card .people .pv{display:inline-block;min-width:16px;padding:0 5px;border-radius:999px;background:var(--line);font-size:11px;text-align:center;color:var(--ink)}
.ptable-wrap{margin:6px 0 10px;overflow-x:auto}
.ptable{width:100%;border-collapse:collapse;font-size:13px}
.ptable th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.ptable td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ptable .by{font-size:12px}
.kv{display:flex;flex-direction:column;gap:2px;margin:6px 0 0}
.kv-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.kv-row .k{width:110px;flex-shrink:0;color:var(--muted);font-weight:600;font-size:12.5px}
.kv-row form{display:flex;gap:6px;flex:1;min-width:200px;margin:0;max-width:420px}
.kv-row form[hidden],.kv-row [hidden]{display:none}
.kv-row input{flex:1;min-width:0;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:7px}
.kv-row .apptok{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:0;padding:0;margin:0;background:none;max-width:none}
.kv-row code{font-size:12.5px;overflow-wrap:anywhere}
.subh{font-size:14px;margin:4px 0 8px;color:var(--ink)}
.hint{color:var(--muted);font-size:12.5px;margin:6px 0 14px}
table.slim td,table.slim th{padding-top:9px;padding-bottom:9px}
table.slim .actions{display:flex;gap:6px;flex-wrap:nowrap;align-items:center;justify-content:flex-end}
table.slim .actions>button{width:auto;padding:6px 12px}
table.slim details.menuwrap>summary{padding:6px 11px}
details.flat>summary{display:none}
.dangerzone{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;padding:12px 14px;border:1px solid #f3c7c3;border-radius:12px;font-size:13px;color:var(--muted)}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Add a blueprint */
.wiz{max-width:900px}
.wstep{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 14px}
.wstep h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.wn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:999px;background:var(--bright,#3dd68c);color:#0f2a1e;font-size:12px;font-weight:800}
.wgrid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}
.startcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 12px}
.scard{position:relative;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 36px;cursor:pointer;background:var(--paper);font-size:13px;color:var(--muted)}
.scard b{color:var(--ink);font-size:14px}
.scard input{position:absolute;left:12px;top:14px}
.scard:has(input:checked){border-color:var(--bright,#3dd68c);box-shadow:0 0 0 1px var(--bright,#3dd68c)}
.sopt{margin-top:4px}
.notesrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.notesrow .primary{margin-left:auto}
.segrow{display:grid;grid-template-columns:110px auto 1fr;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.segrow:first-of-type{border-top:0}
.seglabel{font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.seg label{margin:0;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:5px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.seg input:checked+span{background:var(--forest,#1c2024);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--bright,#3dd68c);outline-offset:1px}
@media (prefers-color-scheme:dark){.seg input:checked+span{background:var(--bright,#3dd68c);color:#0f2a1e}}
.seghint{margin:0}
.seghint q,.finds q{display:block;font-style:italic;color:var(--muted);margin-top:2px}
.finds{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--paper)}
.finds h4{margin:0 0 2px;font-size:14px}
.fgroup{margin:10px 0 0}
.fh{font-weight:700;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px}
.fitem{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin:0 0 6px;font-weight:400}
.fitem input{margin-top:3px}
.fref{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.wsubmit{display:flex;gap:12px;align-items:center}
.uploadalt{margin:18px 0 0;max-width:900px}
.uploadalt>summary{cursor:pointer;color:var(--muted);font-weight:600}
@media (max-width:760px){.wgrid{grid-template-columns:1fr}.segrow{grid-template-columns:1fr}}
.pfamhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.pfamhead:first-child{margin-top:4px}
.seg.sm span{padding:3px 11px;font-size:12px}
/* Products page */
.pfam{margin:0 0 26px}
.pfam>h3{margin:0 0 8px;font-size:16px}
.pcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pcols.one{grid-template-columns:1fr}
.pcol h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pcard{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px}
.pc-name{font-weight:700;color:var(--ink)}
.pc-sub,.pc-guide{font-size:12.5px;color:var(--muted);margin-top:2px}
.pc-act{display:flex;gap:6px;flex-shrink:0;align-items:center}
.btnlike{display:inline-flex;align-items:center;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:700;font-size:12.5px;background:var(--card);color:var(--ink)}
.btnlike:focus-within{outline:2px solid var(--bright,#3dd68c);outline-offset:2px}
.gdlg{width:min(760px,94vw)}
.gdlg .gfields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.gdlg label{display:block;font-weight:600;font-size:13px}
.gdlg input,.gdlg textarea{display:block;width:100%;box-sizing:border-box;margin-top:4px;font:inherit;font-size:13.5px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.gdlg textarea{font-size:13px;line-height:1.5}
.ggroup{border:1px solid var(--line);border-radius:10px;padding:8px 12px 10px;margin:0 0 10px}
.ggroup legend{font-size:12px;color:var(--muted);padding:0 4px}
.ggroup .gtitle{font-weight:700;margin:0 0 6px}
.gwarn{margin:6px 0;padding-left:18px;font-size:12.5px;color:#8a5a00}
@media (prefers-color-scheme:dark){.gwarn{color:#ffd699}}
@media (max-width:760px){.pcols,.gdlg .gfields{grid-template-columns:1fr}}
.engh{margin:14px 0 6px;font-size:13.5px}
.engt{width:100%;border-collapse:collapse;font-size:12.5px;margin:0 0 6px}
.engt th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.engt td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.engt td:first-child{max-width:340px}

<body>
<div class="bar"><div class="mark" aria-hidden="true">L</div><h1>Lean blueprints</h1><div class="spacer"></div><span id="meNote" class="menote" hidden></span><button id="signout" hidden>Sign out</button></div>

<div id="signin" class="signin" hidden>
  <h2>Sign in</h2>
  <p>Use the admin password your team set for this site.</p>
  <form id="signinForm">
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div style="margin-top:14px"><button class="primary" type="submit">Sign in</button></div>
    <div class="err" id="signinErr" role="alert"></div>
  </form>
</div>

<div id="app" class="app" hidden>
  <nav class="side" aria-label="Blueprints">
    <div id="bpList"></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<script type="module">
import { resolveAccent, LEAN_ACCENT } from '/theme.js';
import { syncPlan, planFromRows } from '/plan.js';
import { COUNTERPART, fits, methodsOf, applyIntegration } from '/integration.js';

const KEY = 'leanbp-admin';
let password = sessionStorage.getItem(KEY) || '';
let data = null;
let products = [];
let verticals = [];
let drafting = false;
const NEW = '__new';
const VERT = '__verticals';
const WHATS = '__whatsnew';
const PRODS = '__products';
let bpTab = 'overview'; // the blueprint page's open tab
// "What's new": production requests and review comments since you last looked, on blueprints you own (or that
// have no owner yet), with a switch to show every blueprint. Seen-ness is remembered in this browser.
let activity = [], whatsAll = false, seenBefore = null, firstLoad = true;
const seenAt = () => localStorage.getItem('leanbp-seen-at') || '1970-01-01T00:00:00Z';
const isMine = (e) => !myEmail() || !e.owner_email || e.owner_email === myEmail();
const unread = () => activity.filter((e) => isMine(e) && e.at > seenAt());
let selected = location.hash === '#new' ? NEW : location.hash === '#verticals' ? VERT : location.hash === '#whatsnew' ? WHATS : location.hash === '#products' ? PRODS : (location.hash.slice(1).replace(/^edit:/, '') || null);
let editor = null; // { slug, draft, dirty, row, open:Set }
let showRevoked = false;
const progressTeam = {}; // slug -> chosen client team token
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byName = () => localStorage.getItem('leanbp-by') || '';
// Who's using the admin page: a name and Lean email, asked once and remembered in this browser. Blueprints you
// create or upload are owned by you, so their production requests and review comments are emailed to you.
const myEmail = () => localStorage.getItem('leanbp-email') || '';
function paintMe() {
  const n = $('meNote'); if (!n) return;
  if (!myEmail()) { n.hidden = true; return; }
  n.hidden = false; n.innerHTML = `You: <b></b> · <button type="button" class="linkish">Change</button>`;
  n.querySelector('b').textContent = byName() || myEmail();
  n.querySelector('button').onclick = () => askMe(true);
}
function askMe(changing) {
  if (!changing && myEmail()) return;
  const dlg = document.createElement('dialog'); dlg.className = 'importdlg';
  dlg.innerHTML = `<h3>${changing ? 'Who’s using the admin page?' : 'Before you start'}</h3><p>So the admin page knows which blueprints are yours: blueprints you create or upload are owned by you, and their production requests and review comments show in your <b>What’s new</b>${data && data.emailReady ? ' and are emailed to you' : ''}.</p>
    <form method="dialog" class="meform"><label>Your name<input name="n" autocomplete="name" required></label><label>Your Lean email<input name="e" type="email" autocomplete="email" required placeholder="name@leantech.me"></label><p class="err"></p><div class="iact"><button class="primary" value="ok">Save</button>${changing ? '<button class="ghost" value="cancel" formnovalidate>Cancel</button>' : ''}</div></form>`;
  document.body.appendChild(dlg);
  const f = dlg.querySelector('form'); f.n.value = byName(); f.e.value = myEmail();
  dlg.addEventListener('cancel', (e) => { if (!changing) e.preventDefault(); });
  f.addEventListener('submit', (e) => {
    if (e.submitter && e.submitter.value === 'cancel') { dlg.close(); dlg.remove(); return; }
    const email = f.e.value.trim().toLowerCase();
    const domains = (data && data.leanDomains) || ['leantech.me'];
    const dom = email.split('@')[1] || '';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { e.preventDefault(); f.querySelector('.err').textContent = 'Enter your full email address.'; return; }
    if (!domains.some((d) => dom === d || dom.endsWith('.' + d))) { e.preventDefault(); f.querySelector('.err').textContent = `Use your Lean email (@${domains[0]}).`; return; }
    localStorage.setItem('leanbp-by', f.n.value.trim()); localStorage.setItem('leanbp-email', email);
    paintMe(); dlg.remove(); render();
  });
  dlg.showModal();
}

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + password, ...(opts.headers || {}) } });
  const body = await r.json().catch(() => ({}));
  if (r.status === 401) { signOut(); throw new Error('Wrong admin password'); }
  if (!r.ok) throw new Error(body.error || 'Request failed');
  return body;
}
function signOut() {
  password = ''; sessionStorage.removeItem(KEY);
  $('app').hidden = true; $('signout').hidden = true; $('signin').hidden = false;
}
$('signinForm').addEventListener('submit', async (e) => {
  e.preventDefault(); password = $('pw').value; $('signinErr').textContent = '';
  try { await load(); sessionStorage.setItem(KEY, password); } catch (err) { $('signinErr').textContent = err.message; }
});
$('signout').addEventListener('click', () => { if (confirmLeave()) signOut(); });

async function load() {
  const [ov, lib, act] = await Promise.all([api('/api/admin/overview'), products.length ? null : api('/api/admin/products'), api('/api/admin/activity').catch(() => ({ events: [] }))]);
  activity = act.events || [];
  data = ov; if (lib) { products = lib.products; drafting = !!lib.drafting; }
  verticals = (await api('/api/admin/verticals')).verticals;
  $('signin').hidden = true; $('app').hidden = false; $('signout').hidden = false;
  paintMe(); setTimeout(() => askMe(false), 0);
  // Signing in with something new: start on What's new (unless a page was asked for in the address)
  if (firstLoad) { firstLoad = false; if (!location.hash && unread().length) selected = WHATS; }
  if (!editor && selected !== NEW && selected !== VERT && selected !== WHATS && selected !== PRODS && !data.blueprints.some((b) => b.slug === selected)) selected = data.blueprints[0]?.slug || NEW;
  render();
}

// ---------- formatting ----------
const when = (iso) => {
  if (!iso) return '';
  const d = new Date(iso); const mins = Math.round((Date.now() - d) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
};
const full = (iso) => iso ? new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '';
const dur = (s) => { s = Number(s) || 0; if (s < 60) return s + ' sec'; const m = Math.round(s / 60); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; };
const device = (ua) => {
  ua = ua || '';
  const os = /iPhone|iPad/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : /Mac OS X/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : /Linux/.test(ua) ? 'Linux' : '';
  const br = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : '';
  return [br, os].filter(Boolean).join(' on ');
};
const SLUG_OK = /^[a-z0-9][a-z0-9-]{0,62}$/;
const slugify = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 63);

// A client team's production access request, in full (admin only).
function requestDetails(r) {
  const mbs = (b) => (b ? ` · ${b >= 10485760 ? Math.round(b / 1048576) : (b / 1048576).toFixed(1)} MB` : '');
  const row = (k, v, copy) => `<div class="rqrow"><span class="k">${k}</span><span class="v">${esc(v)}</span>${copy ? `<button type="button" class="ghost mini" data-copy="${esc(v)}" aria-label="Copy ${k}">Copy</button>` : ''}</div>`;
  return `<details class="reqbox"><summary>Production request · ${esc(when(r.created_at))}${r.requested_by ? ` · ${esc(r.requested_by)}` : ''}</summary>

const clientTeams = (slug) => data.links.filter((l) => l.slug === slug && l.kind === 'client' && !l.revoked_at);

  if (!t.length) return 'No client link yet';

// ---------- top-level render ----------
function render() {
  const item = (b) => `

        ${b.open_comments ? `<span class="cmtbadge">💬 ${b.open_comments} open comment${b.open_comments === 1 ? '' : 's'}</span>` : ''}
        ${(() => { const t = clientTeams(b.slug); return b.published && b.items && t.length === 1 ? `<div class="meter" aria-hidden="true"><i style="width:${Math.round((t[0].done / b.items) * 100)}%"></i></div>` : ''; })()}
      </button>`;
  const pub = data.blueprints.filter((b) => b.published);
  const draft = data.blueprints.filter((b) => !b.published);
  const group = (label, list) => list.length ? `<h3 class="grouph">${label} <span>${list.length}</span></h3>${list.map(item).join('')}` : '';
  $('bpList').innerHTML = `<button class="ghost addbp" id="addBp" aria-current="${selected === NEW}">Add a blueprint</button><button class="ghost addbp" id="vertBtn" aria-current="${selected === VERT}">Verticals</button><button class="ghost addbp" id="prodBtn" aria-current="${selected === PRODS}">Products</button><button class="ghost addbp" id="whatsBtn" aria-current="${selected === WHATS}">What’s new${unread().length ? ` <span class="unread" aria-label="${unread().length} unread">${unread().length}</span>` : ''}</button>` + (data.blueprints.length
    ? group('Published', pub) + group('Not published yet', draft)
    : '<p class="s" style="margin:0 8px;color:var(--muted)">No blueprints yet.</p>');
  $('addBp').addEventListener('click', () => go(NEW));
  $('vertBtn').addEventListener('click', () => go(VERT));
  $('prodBtn').addEventListener('click', () => go(PRODS));
  $('whatsBtn').addEventListener('click', () => go(WHATS));
  document.querySelectorAll('.bp').forEach((el) => el.addEventListener('click', () => go(el.dataset.slug)));
  if (editor) return renderEditor();
  if (selected === NEW) return renderAdd();
  if (selected === VERT) return renderVerticals();
  if (selected === WHATS) return renderWhatsNew();
  if (selected === PRODS) return renderProducts();
  const bp = data.blueprints.find((b) => b.slug === selected);
  if (!bp) return renderAdd();

}
function go(slug) {
  if (!confirmLeave()) return;
  editor = null; selected = slug;
  history.replaceState(null, '', slug === NEW ? '#new' : slug === VERT ? '#verticals' : slug === WHATS ? '#whatsnew' : slug === PRODS ? '#products' : '#' + slug);
  render();
}
function confirmLeave() {
  if (selected === VERT && vstate && vstate.dirty.size && !confirm('You have unsaved changes to verticals. Leave without saving?')) return false;
  if (selected === VERT) vstate = null;
  return !editor || !editor.dirty || confirm('You have unsaved changes. Leave without saving?');
}
window.addEventListener('beforeunload', (e) => { if (editor && editor.dirty) { e.preventDefault(); e.returnValue = ''; } });

// ---------- What's new ----------
function renderWhatsNew() {
  if (seenBefore === null) seenBefore = seenAt(); // what counts as new for this visit
  localStorage.setItem('leanbp-seen-at', new Date().toISOString());
  const list = activity.filter((e) => whatsAll || isMine(e));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const line = (e) => {
    const isNew = e.at > seenBefore;
    const who = esc(e.who ? (e.who.includes('@') ? e.who.split('@')[0].split(/[._-]/).map((w) => w[0].toUpperCase() + w.slice(1)).join(' ') : e.who) : 'Someone');
    const what = e.type === 'production'
      ? `🚀 <b>${esc(e.team || 'The client team')}</b> requested production access${e.who ? ` (${who})` : ''}`
      : e.type === 'apptoken'
      ? `🔑 <b>${esc(e.team || 'The client team')}</b> shared their Sandbox app token${e.who ? ` (${who})` : ''}`
      : `💬 <b>${who}</b> ${e.reply ? 'replied to a comment' : 'commented'}${e.section ? ` in ${esc(e.section)}` : ''}`;
    const detail = e.type === 'comment' ? `<div class="wn-body">${e.quote ? `<span class="wn-q">“${esc(e.quote)}”</span> ` : ''}${esc(e.body || '')}</div>` : '';
    return `<li class="${isNew ? 'new' : ''}"><button type="button" class="wn-item" data-slug="${esc(e.slug)}" data-type="${e.type}">
      <div class="wn-top">${what} · <span class="wn-bp">${esc(e.name || e.slug)}</span>${isNew ? ' <span class="wn-new">New</span>' : ''}<span class="wn-at">${esc(when(e.at))}</span></div>${detail}</button></li>`;
  };
  const groups = [['Today', list.filter((e) => new Date(e.at) >= today)], ['Earlier', list.filter((e) => new Date(e.at) < today)]];
  $('main').innerHTML = `<h2>What’s new</h2>
    <p class="sub">Production requests, comments and app tokens ${whatsAll ? 'on every blueprint' : 'on your blueprints'}${myEmail() ? '' : ' (set who you are, top right, to filter)'}.</p>
    <label class="wn-all"><input type="checkbox" id="wnAll"${whatsAll ? ' checked' : ''}> Show all blueprints</label>
    ${list.length ? groups.filter(([, g]) => g.length).map(([t, g]) => `<h3 class="grouph">${t}</h3><ul class="wn">${g.map(line).join('')}</ul>`).join('') : '<p class="by">Nothing yet. Production requests and review comments will show up here.</p>'}`;
  $('wnAll').addEventListener('change', (e) => { whatsAll = e.target.checked; renderWhatsNew(); });
  document.querySelectorAll('.wn-item').forEach((b) => b.addEventListener('click', () => {
    const type = b.dataset.type; go(b.dataset.slug);
    setTimeout(() => {
      if (window.bpShowTab) window.bpShowTab(type === 'comment' ? 'comments' : 'overview');
      const target = type === 'production' ? document.querySelector('.reqbox') : type === 'apptoken' ? document.querySelector('.apptok') : $('commentsBox');
      if (target) { target.open = true; target.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }, 60);
  }));
  // the badge in the sidebar clears now that they're seen
  const badge = document.querySelector('#whatsBtn .unread'); if (badge) badge.remove();
}

    const p = products.find((x) => x.id === inp.dataset.upload);
    if (p.guide && !p.guide.uploaded && !confirm(`${p.name} has a built-in guide. An uploaded checklist replaces it in new and republished blueprints. You can remove the upload later to go back. Continue?`)) return;
    if (f.size > 3_000_000) return status('The file is over 3 MB. Remove images or split it, then try again.');
    status('Reading ' + f.name + '…');
    try { const parsed = await api('/api/admin/products', { method: 'POST', body: JSON.stringify({ action: 'parse', filename: f.name, data: await b64(f) }) }); status(''); guideDialog(p, parsed, f.name); }
    catch (err) { status(err.message); }
  }));
  document.querySelectorAll('[data-pedit]').forEach((b) => b.addEventListener('click', () => productDialog(products.find((x) => x.id === b.dataset.pedit))));
  document.querySelectorAll('[data-padd]').forEach((b) => b.addEventListener('click', () => productDialog(null, b.dataset.padd, b.dataset.method)));
}

// Review an uploaded checklist: groups with a title and one step per line
function guideDialog(p, parsed, filename) {
  const dlg = document.createElement('dialog'); dlg.className = 'importdlg gdlg';
  const groups = parsed.groups.map((g) => ({ title: g.title, text: g.steps.map(stepToLine).join('\n') }));
  const lines = (t) => t.split('\n').filter((l) => l.trim()).length;
  const count = () => { const ts = [...dlg.querySelectorAll('.gsteps')]; return ts.length ? ts.reduce((a, t) => a + lines(t.value), 0) : groups.reduce((a, g) => a + lines(g.text), 0); };
  const draw = () => {
    dlg.innerHTML = `<h3>Review the guide for ${esc(p.name)}</h3>
      <p class="hint">Read from ${esc(filename)}. Each line is one step; edit, add or remove lines as needed.</p>
      ${parsed.warnings.length ? `<ul class="gwarn">${parsed.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
      <div class="gfields"><label>Guide title<input id="gTitle" value="${esc(parsed.title || p.name)}"></label>
      <label>Short description <span class="never">(optional)</span><input id="gSub" value="${esc(parsed.sub || '')}" placeholder="What the guide helps the client do"></label></div>
      <div id="gGroups">${groups.map((g, i) => `<fieldset class="ggroup"><legend>Group ${i + 1}</legend>
        <input class="gtitle" value="${esc(g.title)}" placeholder="Group title, e.g. Build" aria-label="Group ${i + 1} title">
        <textarea class="gsteps" rows="${Math.min(14, Math.max(3, g.text.split('\n').length + 1))}" aria-label="Group ${i + 1} steps, one per line">${esc(g.text)}</textarea>
        <button type="button" class="linkish" data-gdel="${i}">Remove group</button></fieldset>`).join('')}</div>
      <button type="button" class="linkish" id="gAdd">Add a group</button>
      <p class="err" id="gErr" role="alert"></p>
      <div class="iact"><button type="button" class="primary" id="gSave">Save guide (<span id="gCount">${count()}</span> steps)</button><button type="button" class="ghost" id="gCancel">Cancel</button></div>`;
    const sync = () => dlg.querySelectorAll('.ggroup').forEach((fs, i) => { groups[i].title = fs.querySelector('.gtitle').value; groups[i].text = fs.querySelector('.gsteps').value; });
    dlg.querySelectorAll('.gsteps').forEach((t) => t.addEventListener('input', () => { dlg.querySelector('#gCount').textContent = count(); }));
    dlg.querySelectorAll('[data-gdel]').forEach((b) => b.addEventListener('click', () => { sync(); groups.splice(Number(b.dataset.gdel), 1); draw(); }));
    dlg.querySelector('#gAdd').addEventListener('click', () => { sync(); groups.push({ title: '', text: '' }); draw(); dlg.querySelectorAll('.gtitle')[groups.length - 1].focus(); });
    dlg.querySelector('#gCancel').addEventListener('click', () => { dlg.close(); dlg.remove(); });
    dlg.querySelector('#gSave').addEventListener('click', async (e) => {
      sync(); e.target.disabled = true;
      const guide = { title: dlg.querySelector('#gTitle').value, sub: dlg.querySelector('#gSub').value, groups: groups.map((g) => ({ title: g.title, steps: g.text.split('\n').map((l) => l.trim()).filter(Boolean).map(lineToStep) })) };
      try { const r = await api('/api/admin/products', { method: 'POST', body: JSON.stringify({ action: 'guide', id: p.id, guide, filename, by: byName() || undefined }) }); dlg.close(); dlg.remove(); await reloadProducts(); renderProducts(); status(`${p.name} now has a ${r.steps}-step guide`); }
      catch (err) { dlg.querySelector('#gErr').textContent = err.message; e.target.disabled = false; }
    });
  };
  document.body.appendChild(dlg); draw(); dlg.showModal();
}

// Edit a product's wording, or add a product of your own
function productDialog(p, fam, method) {
  const dlg = document.createElement('dialog'); dlg.className = 'importdlg';
  const adding = !p;
  dlg.innerHTML = `<h3>${adding ? 'Add a product' : 'Edit ' + esc(p.name)}</h3>
    <form method="dialog" class="meform">
      <label>Name<input name="name" required maxlength="80" value="${esc(adding ? '' : p.name)}"></label>
      ${adding ? `<label>Family<select name="family">${FAMS.map(([f, l]) => `<option value="${f}"${f === fam ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="mrow">Integration<select name="method"><option value="sdk"${method === 'sdk' ? ' selected' : ''}>SDK</option><option value="api"${method === 'api' ? ' selected' : ''}>API</option></select></label>` : ''}
      <label>Short description<input name="sub" maxlength="80" value="${esc(adding ? '' : p.sub || '')}" placeholder="e.g. through the Link SDK"></label>
      <label>Card text<textarea name="card" rows="3" maxlength="300" placeholder="One sentence for the product card on blueprints">${esc(adding ? '' : p.card || '')}</textarea></label>
      ${adding ? '' : `<label>Effort<input name="effort" maxlength="40" value="${esc(p.effort || '')}"></label>`}
      ${!adding && p.guide && p.guide.uploaded ? `<p class="hint">Guide uploaded from ${esc(p.guide.uploaded.filename || 'a file')}. <button type="button" class="linkish" data-rmguide>Remove the uploaded guide</button></p>` : ''}
      <p class="err" role="alert"></p>
      <div class="iact"><button class="primary" value="ok">${adding ? 'Add product' : 'Save'}</button><button class="ghost" value="cancel" formnovalidate>Cancel</button>
        ${!adding && p.custom ? '<button type="button" class="ghost danger" data-premove>Remove product</button>' : ''}</div>
    </form>`;
  document.body.appendChild(dlg);
  const f = dlg.querySelector('form'), err = dlg.querySelector('.err');
  const mrow = dlg.querySelector('.mrow'); const famSel = f.family;
  if (famSel) { const upd = () => { mrow.style.display = famSel.value === 'other' ? 'none' : ''; }; famSel.addEventListener('change', upd); upd(); }
  const done = async (msg) => { dlg.close(); dlg.remove(); await reloadProducts(); renderProducts(); status(msg); };
  f.addEventListener('submit', async (e) => {

    e.preventDefault(); err.textContent = '';
    const body = adding ? { action: 'add', name: f.name.value, family: f.family.value, method: f.method.value, sub: f.sub.value, card: f.card.value, by: byName() || undefined }
      : { action: 'save', id: p.id, name: f.name.value, sub: f.sub.value, card: f.card.value, effort: f.effort.value, by: byName() || undefined };
    try { await api('/api/admin/products', { method: 'POST', body: JSON.stringify(body) }); await done(adding ? `${f.name.value} added` : 'Saved'); }
    catch (x) { err.textContent = x.message; }
  });
  const rg = dlg.querySelector('[data-rmguide]'); if (rg) rg.addEventListener('click', async () => {
    if (!confirm(`Remove the uploaded guide from ${p.name}?`)) return;
    try { await api('/api/admin/products', { method: 'POST', body: JSON.stringify({ action: 'removeGuide', id: p.id }) }); await done('Uploaded guide removed'); } catch (x) { err.textContent = x.message; }
  });
  const rm = dlg.querySelector('[data-premove]'); if (rm) rm.addEventListener('click', async () => {
    if (!confirm(`Remove ${p.name} from the catalogue?`)) return;
    try { await api('/api/admin/products', { method: 'POST', body: JSON.stringify({ action: 'remove', id: p.id }) }); await done(`${p.name} removed`); } catch (x) { err.textContent = x.message; }
  });
  dlg.showModal(); f.name.focus();
}

// ---------- verticals page ----------
function onVerticalField(e) {
  if (selected !== VERT || !vstate) return;
  const el = e.target; if (!el.dataset || el.dataset.v === undefined) return;
  const vi = +el.dataset.v; const v = vstate.list[vi]; if (!v) return;
  const val = el.dataset.lines ? el.value.split('\n').map((x) => x.trim()).filter(Boolean) : el.value;
  const parts = el.dataset.f.split('.'); let t = v; for (const k of parts.slice(0, -1)) t = t[k]; t[parts[parts.length - 1]] = val;
  vstate.dirty.add(vi);
}
async function onVerticalClick(e) {
  if (selected !== VERT || !vstate) return;
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset; const L = vstate.list;
  if (d.vaddrow !== undefined) { L[+d.vaddrow].painRows.push({ group: 'business', pain: '', solve: '', advantage: '' }); vstate.dirty.add(+d.vaddrow); renderVerticals(); }
  else if (d.vdelrow !== undefined) { L[+d.vdelrow].painRows.splice(+d.i, 1); vstate.dirty.add(+d.vdelrow); renderVerticals(); }
  else if (d.vmove !== undefined) { const r = L[+d.vmove].painRows; const i = +d.i, j = i + +d.d; [r[i], r[j]] = [r[j], r[i]]; vstate.dirty.add(+d.vmove); renderVerticals(); }
  else if (d.vsave !== undefined) {
    const vi = +d.vsave; const v = L[vi]; $('vErr').textContent = '';
    try {
      const saved = await api('/api/admin/verticals', { method: 'POST', body: JSON.stringify({ id: v.id, name: v.name, painIntro: v.painIntro, painRows: v.painRows, useCases: v.useCases, by: byName() }) });
      L[vi] = saved; vstate.dirty.delete(vi); verticals = (await api('/api/admin/verticals')).verticals; status(`${saved.name} saved`); renderVerticals();
    } catch (err) { $('vErr').textContent = err.message; }
  } else if (d.vdel !== undefined) {
    const vi = +d.vdel; const v = L[vi];
    if (!confirm(`Delete the ${v.name || 'new'} vertical? Blueprints already made from it keep their content.`)) return;
    try {
      if (v.id) await api('/api/admin/verticals', { method: 'DELETE', body: JSON.stringify({ id: v.id }) });
      L.splice(vi, 1); vstate.dirty = new Set(); vstate.open = new Set(); verticals = (await api('/api/admin/verticals')).verticals; status('Vertical deleted'); renderVerticals();
    } catch (err) { $('vErr').textContent = err.message; }
  }
}
$('main').addEventListener('input', onVerticalField);
$('main').addEventListener('change', onVerticalField);
$('main').addEventListener('click', onVerticalClick);

let vstate = null; // { list: [...], dirty: Set(index), open: Set(index) }

      <div class="itemhead"><strong>Row ${i + 1}</strong>

  $('main').innerHTML = `
    <h2>Verticals</h2>

    <div class="err" id="vErr" role="alert"></div>
    ${L.map((v, vi) => `<details class="sec" data-vsec="${vi}"${vstate.open.has(vi) ? ' open' : ''}>
      <summary><span>${esc(v.name || 'New vertical')} <span class="cnt">${v.painRows.length} ${v.painRows.length === 1 ? 'pain point' : 'pain points'}, ${v.useCases.length} ${v.useCases.length === 1 ? 'use case' : 'use cases'}${vstate.dirty.has(vi) ? ', unsaved changes' : ''}</span></span></summary>
      <div class="secbody">
        <div class="g2"><div><label>Name</label><input type="text" data-v="${vi}" data-f="name" value="${esc(v.name)}" maxlength="60"></div></div>
        <div><label>Introduction</label><textarea data-v="${vi}" data-f="painIntro" rows="3" placeholder="Shown above the pain points table">${esc(v.painIntro)}</textarea></div>
        <div class="subhead">Pain points</div>
        ${v.painRows.map((r, i) => vrow(vi, r, i, v.painRows.length)).join('') || '<div class="hint">No pain points yet.</div>'}
        <div><button type="button" class="ghost" data-vaddrow="${vi}">Add a pain point</button></div>
        <div><label>Use cases</label><textarea data-v="${vi}" data-f="useCases" data-lines="1" rows="3" placeholder="One per line, e.g. Wallet top-up">${esc(v.useCases.join('\n'))}</textarea><div class="hint">Shown as chips in the journeys section.</div></div>
        <div style="display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap">
          <button type="button" class="ghost danger" data-vdel="${vi}">Delete vertical</button>
          <button type="button" class="primary" data-vsave="${vi}" style="height:38px">Save ${esc(v.name || 'vertical')}</button></div>
        ${v.updatedAt ? `<div class="hint">Last saved ${esc(when(v.updatedAt))}${v.updatedBy ? ' by ' + esc(v.updatedBy) : ''}.</div>` : ''}
      </div></details>`).join('')}
    <div><button type="button" class="ghost" id="vAdd">Add a vertical</button></div>`;
  $('main').querySelectorAll('details[data-vsec]').forEach((el) => el.addEventListener('toggle', () => { const i = +el.dataset.vsec; el.open ? vstate.open.add(i) : vstate.open.delete(i); }));
  $('vAdd').addEventListener('click', () => { L.push({ id: '', name: '', painIntro: '', painRows: [], useCases: [] }); vstate.open.add(L.length - 1); vstate.dirty.add(L.length - 1); renderVerticals(); });
}

function newContent(name, by) {

    client: { name, logo: '' }, header: { mode: 'name', logoSize: 'medium' }, theme: { mode: 'lean', color: LEAN_ACCENT },

// Every library product gets an entry, so the form can set its phase.
function preparePlan(d) {
  planFromRows(d, products);
  for (const p of products) if (!d.launch.assign[p.id]) d.launch.assign[p.id] = { phase: -1, effort: '', note: '', card: '', linkLabel: '', linkUrl: '' };
  syncPlan(d, products);

}
// Fill any fields missing from older drafts.
function withDefaults(c) {
  const base = newContent('', '');
  const merge = (a, b) => { for (const k of Object.keys(a)) { if (b[k] === undefined) b[k] = a[k]; else if (a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) merge(a[k], b[k]); } return b; };
  return merge(base, c || {});
}
const getP = (o, path) => path.split('.').reduce((x, k) => (x == null ? x : x[k]), o);
function setP(o, path, v) { const ks = path.split('.'); const last = ks.pop(); const t = ks.reduce((x, k) => x[k], o); t[last] = v; }

}

  form.querySelectorAll('details.more').forEach((el) => el.addEventListener('toggle', () => { el.open ? editor.moreOpen.add(el.dataset.more) : editor.moreOpen.delete(el.dataset.more); }));
  document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => { editor.tab = b.dataset.tab; rerender(); }));
  document.querySelectorAll('[data-dismiss]').forEach((b) => b.addEventListener('click', () => { delete editor.draft.reviewNote; delete editor.draft.draftQuestions; markDirty(); rerender(); }));
  form.addEventListener('input', onField);
  form.addEventListener('change', onField);
  form.addEventListener('click', onClick);
  const tColor = $('tColor'); const tHex = $('tHex');
  if (tColor) {
    tColor.addEventListener('input', () => { editor.draft.theme.color = tColor.value; tHex.value = tColor.value; markDirty(); $('tp').innerHTML = themePreview(); });
    tHex.addEventListener('input', () => { editor.draft.theme.color = tHex.value.trim(); markDirty(); $('tp').innerHTML = themePreview(); const r = resolveAccent(tHex.value); if (!/not a valid/i.test(r.note)) tColor.value = r.accent; });
  }
  $('edClose').addEventListener('click', () => { if (!confirmLeave()) return; const slug = editor.slug; editor = null; go(slug); });
  $('edSave').addEventListener('click', () => save('save'));
  $('edPublish').addEventListener('click', () => {
    if (!confirm('Publish this blueprint? Anyone with a link will see this version straight away.')) return;
    save('publish');
  });
  $('edPreview').addEventListener('click', preview);
}
document.addEventListener('keydown', (e) => { if (editor && (e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); save('save'); } });

function onField(e) {
  const el = e.target;
  if (el.dataset && el.dataset.pmethod) {   // the Launch plan's SDK / API switch for a product family
    if (e.type !== 'change') return;
    const fam = el.dataset.pmethod, m = el.value.toUpperCase(), label = fam === 'payments' ? 'Payments' : 'Data';
    if (!confirm(`Switch ${label} to ${m}? Its products move to their ${m} versions, keeping their phase, effort and notes. Products with no ${m} version are removed, and journeys using them are updated.`)) { rerender(); return; }
    applyIntegration(editor.draft, { [fam]: el.value }, products); markDirty(); syncPlan(editor.draft, products); rerender(); return;
  }
  const p = el.dataset && el.dataset.k; if (!p) return;
  if (e.type === 'input' && (el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT')) return;
  let v;
  if (el.dataset.multi) { const arr = new Set(getP(editor.draft, p) || []); el.checked ? arr.add(el.dataset.multi) : arr.delete(el.dataset.multi); v = [...arr]; }
  else if (el.type === 'checkbox') v = el.checked;
  else if (el.dataset.lines) v = el.value.split('\n').map((s) => s.trim()).filter(Boolean);
  else v = el.value;
  if (el.dataset.int) v = parseInt(v, 10);
  setP(editor.draft, p, v); markDirty();
  if (p.startsWith('launch.')) syncPlan(editor.draft, products);
  if (p === 'client.name') { $('tp').innerHTML = themePreview(); return; }
  if (el.dataset.rerender) rerender();
}

function remapPhases(fn) {
  const L = editor.draft.launch;
  for (const a of Object.values(L.assign || {})) if (Number.isInteger(a.phase) && a.phase >= 0) a.phase = fn(a.phase);
  for (const x of L.custom || []) if (Number.isInteger(x.phase) && x.phase >= 0) x.phase = fn(x.phase);
}

async function onClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  const d = editor.draft;
  if (b.dataset.add) {
    const listv = getP(d, b.dataset.add); listv.push(TPL[b.dataset.tpl](listv.length + 1)); markDirty(); syncPlan(d, products); rerender();
  } else if (b.dataset.del) {
    if (!confirm(b.dataset.del === 'launch.phases' ? 'Remove this phase? Its products move to “Not included”.' : 'Remove this?')) return;
    const i = +b.dataset.i;
    getP(d, b.dataset.del).splice(i, 1);
    if (b.dataset.del === 'launch.phases') remapPhases((x) => (x === i ? -1 : x > i ? x - 1 : x));
    markDirty(); syncPlan(d, products); rerender();
  } else if (b.dataset.move) {
    const l = getP(d, b.dataset.move); const i = +b.dataset.i; const j = i + +b.dataset.d; [l[i], l[j]] = [l[j], l[i]];
    if (b.dataset.move === 'launch.phases') remapPhases((x) => (x === i ? j : x === j ? i : x));
    markDirty(); syncPlan(d, products); rerender();
  } else if (b.dataset.dismiss) {
    delete d[b.dataset.dismiss]; markDirty(); rerender();
  } else if (b.dataset.delimg) {
    const p = b.dataset.delimg; const v = getP(d, p);
    Array.isArray(v) ? v.splice(+b.dataset.i, 1) : setP(d, p, ''); markDirty(); rerender();
  }
}

document.addEventListener('change', async (e) => {
  const el = e.target; if (!editor || !el.dataset || !el.dataset.img) return;
  const files = [...el.files]; if (!files.length) return;
  try {
    const out = [];
    for (const f of files) out.push(await shrink(f, +el.dataset.w, el.dataset.kind));
    const p = el.dataset.img;
    if (el.dataset.single) { setP(editor.draft, p, out[0]); if (p === 'client.logo') editor.draft.header.mode = 'logo'; }
    else { const cur = getP(editor.draft, p) || []; setP(editor.draft, p, cur.concat(out).slice(0, p.endsWith('images') && p.startsWith('design') ? 3 : 2)); }
    markDirty(); rerender();
  } catch (err) { status(err.message); }
});

// Resizes screenshots to the size the page shows them at, so blueprints stay light.
function shrink(file, maxW, kind) {
  return new Promise((resolve, reject) => {
    if (file.size > 15_000_000) return reject(new Error('That image is over 15 MB. Use a smaller one.'));
    if (file.type === 'image/svg+xml') {
      if (file.size > 300_000) return reject(new Error('That SVG is over 300 KB. Use a simpler logo file.'));
      const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = () => reject(new Error('Could not read that file.')); r.readAsDataURL(file); return;
    }
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width, kind === 'logo' ? 160 / img.height : 1);
      const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const ctx = c.getContext('2d'); if (kind !== 'logo') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(kind === 'logo' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file isn’t an image the browser can read.')); };
    img.src = url;
  });
}

async function save(action) {
  const btns = ['edSave', 'edPublish', 'edPreview'].map($); btns.forEach((b) => b && (b.disabled = true)); $('edErr').textContent = '';
  try {
    syncPlan(editor.draft, products);
    const row = await api('/api/admin/builder', { method: 'POST', body: JSON.stringify({ action, slug: editor.slug, content: editor.draft, by: byName() }) });
    editor.row = row; editor.dirty = false;
    const ov = await api('/api/admin/overview'); data = ov;
    status(action === 'publish' ? 'Published. Links show this version now.' : 'Draft saved');
    rerender();
  } catch (err) { $('edErr').textContent = err.message; btns.forEach((b) => b && (b.disabled = false)); }
}

async function preview() {
  const w = window.open('', '_blank');
  try {
    syncPlan(editor.draft, products);
    const { html } = await api('/api/admin/builder', { method: 'POST', body: JSON.stringify({ action: 'preview', content: editor.draft }) });
    const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    if (w) w.location = url; else location.assign(url);
  } catch (err) { if (w) w.close(); $('edErr').textContent = err.message; }
}

// ---------- progress breakdown ----------
async function loadProgress(bp) {
  let pg;
  try { pg = await api('/api/admin/progress?slug=' + encodeURIComponent(bp.slug)); }
  catch (err) { const el = $('progressBody'); if (el) el.innerHTML = `<div class="empty">${esc(err.message)}</div>`; return; }
  const el = $('progressBody'); if (!el || selected !== bp.slug) return;
  const st = pg.structure;
  const counts = (i) => !i.key.includes('-prod-'); // production steps aren't counted
  const totalItems = Object.values(st.panels).reduce((n, p) => n + p.items.filter(counts).length, 0) + st.loose.filter(counts).length;
  if (!pg.teams.length) { el.innerHTML = '<div class="empty">No client team link yet. Progress shows here once a client team has a link.</div>'; return; }
  if (!totalItems) { el.innerHTML = '<div class="empty">This blueprint has no checklist items.</div>'; return; }
  const chosen = pg.teams.find((t) => t.token === progressTeam[bp.slug]) || pg.teams[0];
  const ticks = chosen.items;
  const isDone = (k) => !!(ticks[k] && ticks[k].done);
  const short = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '';
  const lastAt = Object.values(ticks).filter((t) => t.done).map((t) => t.at).sort().pop();
  const bar = (d, n) => `<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${d}"><i style="width:${n ? Math.round((d / n) * 100) : 0}%"></i></div>`;
  const itemList = (items) => `<ul class="pg-items">${items.map((i) => `<li class="${isDone(i.key) ? 'done' : ''}"><span class="mk" aria-label="${isDone(i.key) ? 'Done' : 'Not done'}">${isDone(i.key) ? '✓' : ''}</span><span class="tx">${esc(i.text)}</span><span class="dt">${isDone(i.key) ? esc(short(ticks[i.key].at)) + (ticks[i.key].by ? ` · ${esc(ticks[i.key].by)}` : '') : ''}</span></li>`).join('')}</ul>`;
  const guide = (id) => { const p = st.panels[id]; const c = p.items.filter(counts); const extra = p.items.filter((i) => !counts(i)); const d = c.filter((i) => isDone(i.key)).length;
    return `<details class="pg-guide"><summary><span class="nm">${esc(p.name)}</span>${bar(d, c.length)}<span class="n">${d} of ${c.length}</span></summary>${itemList(c)}${extra.length ? `<div class="pg-none" style="margin-top:12px"><b>Production</b>, not counted in progress:</div>${itemList(extra)}` : ''}</details>`; };
  const phaseCard = (title, ids, extra) => {
    const items = ids.flatMap((id) => st.panels[id].items).concat(extra || []).filter(counts);
    const d = items.filter((i) => isDone(i.key)).length;
    if (!items.length) return `<div class="pg-phase"><div class="pg-head"><strong>${esc(title)}</strong></div><div class="pg-none">No checklist items in this phase.</div></div>`;
    return `<div class="pg-phase"><div class="pg-head"><strong>${esc(title)}</strong><span class="n">${d} of ${items.length}</span></div>${bar(d, items.length)}
      ${ids.map(guide).join('')}${extra && extra.length ? `<details class="pg-guide"><summary><span class="nm">Other items</span>${bar(extra.filter((i) => isDone(i.key)).length, extra.length)}<span class="n">${extra.filter((i) => isDone(i.key)).length} of ${extra.length}</span></summary>${itemList(extra)}</details>` : ''}</div>`;
  };
  // Guides not attached to any phase (e.g. files without phase markers) still get a card.
  const used = new Set(st.phases.flatMap((p) => p.panels));
  const unphased = Object.keys(st.panels).filter((id) => !used.has(id));
  const SETUP = ['dev', 'start', 'wh'];
  const startIds = SETUP.filter((id) => unphased.includes(id));
  const otherIds = unphased.filter((id) => !SETUP.includes(id));
  const cards = (startIds.length ? [phaseCard('Phase 0 · Setup', startIds)] : [])
    .concat(st.phases.map((p) => phaseCard(`${p.label} · ${p.title}`, p.panels)))
    .concat(otherIds.length || st.loose.length ? [phaseCard(st.phases.length ? 'Other checklists' : 'Checklist', otherIds, st.loose)] : []);
  const allDone = Object.values(st.panels).flatMap((p) => p.items).concat(st.loose).filter(counts).filter((i) => isDone(i.key)).length;
  const SET = ['dev', 'start', 'wh'];
  const keysOf = (ids, prod) => ids.filter((id) => st.panels[id]).flatMap((id) => st.panels[id].items).filter((i) => (prod ? i.key.includes('-prod-') : !i.key.includes('-prod-')));
  const mile = (name, list) => { const d = list.filter((i) => isDone(i.key)).length; return list.length ? `<span class="pg-mile${d === list.length ? ' done' : ''}">${d === list.length ? '✓ ' + name + ' complete' : `${name}: ${d} of ${list.length}`}</span>` : ''; };
  const env = chosen.environment === 'production' ? 'production' : 'sandbox';
  const miles = `<div class="pg-miles"><span class="pg-mile">${env === 'production' ? 'Production' : 'Sandbox'}</span>${mile('Sandbox setup', keysOf(SET, false))}${mile('End-to-end test', keysOf(['e2e'], false))}${env !== 'production' && chosen.productionRequestedAt ? `<span class="pg-mile wait">Production requested ${esc(short(chosen.productionRequestedAt))}</span>` : ''}${env === 'production' ? mile('Production setup', keysOf(SET, true)) : ''}</div>`;
  el.innerHTML = miles + `<div class="pg-top">
      ${pg.teams.length > 1 ? `<label for="pgTeam" style="margin:0">Client team</label><select id="pgTeam">${pg.teams.map((t) => `<option value="${esc(t.token)}"${t.token === chosen.token ? ' selected' : ''}>${esc(t.label)}</option>`).join('')}</select>` : `<strong style="color:var(--ink)">${esc(chosen.label)}</strong>`}
      <span>${allDone} of ${totalItems} checklist items done overall${lastAt ? `, last ticked ${esc(short(lastAt))}` : ''}.</span>
    </div><div class="pg">${cards.join('')}</div>`;
  const sel = $('pgTeam'); if (sel) sel.addEventListener('change', () => { progressTeam[bp.slug] = sel.value; loadProgress(bp); });
}

// Client team links open in Lean view (read only, not counted as a visit); Lean team links open as they are.
async function openLink(token, kind) {
  if (kind !== 'client') { window.open(location.origin + '/b/' + token, '_blank', 'noopener'); return; }
  const w = window.open('', '_blank');
  try {
    const { url } = await api('/api/admin/view', { method: 'POST', body: JSON.stringify({ token }) });
    if (w) w.location = url; else location.assign(url);
  } catch (err) { if (w) w.close(); status(err.message); }
}

// Text edited on the page (Edit on page tab) arrives here and updates the form content.
const EDIT_PATH = /^[A-Za-z0-9_.-]+(#\d+)?$/;
window.addEventListener('message', (e) => {
  const f = $('edFrame');
  if (!editor || !f || e.source !== f.contentWindow) return;
  const m = e.data;
  if (!m || m.type !== 'lb-edit' || typeof m.path !== 'string' || !EDIT_PATH.test(m.path)) return;
  const value = String(m.value ?? '').slice(0, 3000);
  const d = editor.draft;
  if (m.path.includes('#')) {
    const [path, k] = m.path.split('#');
    const lines = String(getP(d, path) || '').split('\n').map((x) => x.trim()).filter(Boolean);
    lines[+k] = value;
    setP(d, path, lines.filter((x) => x !== undefined).join('\n'));
  } else {
    const parts = m.path.split('.');
    let t = d;
    for (const k of parts.slice(0, -1)) { if (t[k] == null || typeof t[k] !== 'object') t[k] = {}; t = t[k]; }
    t[parts[parts.length - 1]] = value;
  }
  if (m.path.startsWith('launch.')) syncPlan(d, products);
  markDirty();
});

async function loadPage() {
  const f = $('edFrame'); if (!f) return;
  try {
    syncPlan(editor.draft, products);
    const { html } = await api('/api/admin/builder', { method: 'POST', body: JSON.stringify({ action: 'preview', content: editor.draft, edit: true }) });
    f.srcdoc = html;
  } catch (err) { $('edErr').textContent = err.message; }
}

function copy(text) { navigator.clipboard.writeText(text).then(() => status('Link copied'), () => prompt('Copy this link:', text)); }
let st;
function status(msg) {
  let el = document.querySelector('.status');
  if (!el) { el = document.createElement('div'); el.className = 'status'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; clearTimeout(st); st = setTimeout(() => el.remove(), 3000);
}

if (password) load().then(() => {
  const m = location.hash.match(/^#edit:(.+)$/);
  if (m) api('/api/admin/builder?slug=' + encodeURIComponent(m[1])).then(openEditor).catch(() => {});
}).catch(signOut); else signOut();
